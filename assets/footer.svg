<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="120" viewBox="0 0 1200 120" role="img" aria-label="Footer">
  <defs>
    <linearGradient id="fg" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#2c5364"/>
      <stop offset="0.5" stop-color="#203a43"/>
      <stop offset="1" stop-color="#0f2027"/>
    </linearGradient>
  </defs>
  <rect width="1200" height="120" fill="url(#fg)"/>
  <g>
    <path d="M0 60 Q 150 20 300 60 T 600 60 T 900 60 T 1200 60 T 1500 60 T 1800 60 V120 H0 Z" fill="#36BCF7" opacity="0.18">
      <animateTransform attributeName="transform" type="translate" from="-600 0" to="0 0" dur="10s" repeatCount="indefinite"/>
    </path>
    <path d="M0 75 Q 150 40 300 75 T 600 75 T 900 75 T 1200 75 T 1500 75 T 1800 75 V120 H0 Z" fill="#36BCF7" opacity="0.12">
      <animateTransform attributeName="transform" type="translate" from="0 0" to="-600 0" dur="14s" repeatCount="indefinite"/>
    </path>
  </g>
  <text x="600" y="95" text-anchor="middle" font-family="'Segoe UI', Helvetica, Arial, sans-serif" font-size="14" fill="#9fb8c4" letter-spacing="2">THANKS FOR VISITING</text>
</svg>
